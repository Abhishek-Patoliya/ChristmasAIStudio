name: ChristmasAIStudio
options:
  bundleIdPrefix: com.christmasai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ChristmasAIStudio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChristmasAIStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christmasai.studio
        PRODUCT_NAME: ChristmasAIStudio
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ChristmasAIStudio/Resources/Info.plist
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
  ChristmasAIStudioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChristmasAIStudioTests
    dependencies:
      - target: ChristmasAIStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christmasai.studio.tests
        PRODUCT_NAME: ChristmasAIStudioTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
schemes:
  ChristmasAIStudio:
    build:
      targets:
        ChristmasAIStudio: all
        ChristmasAIStudioTests: [test]
    run:
      config: Debug
      storeKitConfiguration: ChristmasAIStudio/Resources/ChristmasAIStudio.storekit
    test:
      config: Debug
      targets:
        - ChristmasAIStudioTests
